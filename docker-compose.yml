services:
  postgres:
    image: postgres:16-alpine
    container_name: flamboyant_db
    environment:
      POSTGRES_DB: flamboyant_seguros
      POSTGRES_USER: flamboyant
      POSTGRES_PASSWORD: flamboyant123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flamboyant -d flamboyant_seguros"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flamboyant_api
    environment:
      DATABASE_URL: postgres://flamboyant:flamboyant123@postgres:5432/flamboyant_seguros?sslmode=disable
      JWT_SECRET: flamboyant_secret_dev_32_chars_long
      JWT_EXPIRATION_HOURS: 8
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: flamboyant_web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080/api
    volumes:
      - ./frontend/src:/app/src:cached
      - ./frontend/public:/app/public:cached
    depends_on:
      - backend

volumes:
  postgres_data:
    name: flamboyant_postgres_data
