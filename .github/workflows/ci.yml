name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'sua_senha' }}
          POSTGRES_DB: seguros_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'sua_senha' }}
          PG_DBNAME: seguros_db
          PG_SSLMODE: disable
        run: |
          go test ./...

      - name: Run Migrations and Seed
        working-directory: ./backend
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'sua_senha' }}
          PG_DBNAME: seguros_db
          PG_SSLMODE: disable
        run: |
          go run ./cmd/migrate -seed

      - name: Run Smoke Integration Tests
        working-directory: ./backend
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'sua_senha' }}
          PG_DBNAME: seguros_db
          PG_SSLMODE: disable
        run: |
          go run ./cmd/api &
          sleep 5
          go test -tags smoke ./smoke_test.go -v

      - name: Install Frontend
        working-directory: ./frontend
        run: |
          corepack enable
          corepack pnpm install

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          corepack pnpm build
